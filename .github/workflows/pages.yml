name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh once a day at 09:00 UTC so the heatmap stays current even
    # without a code push.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync portfolio data
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          # The per-run GITHUB_TOKEN gives 1000 req/h — plenty for a personal
          # portfolio. Override via repo secret PORTFOLIO_TOKEN if you need
          # cross-org access.
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_TOKEN || secrets.GITHUB_TOKEN }}
        run: pnpm sync

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
