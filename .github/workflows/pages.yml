name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh once a day at 09:00 UTC so the heatmap stays current even
    # without a code push.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Sync portfolio data
        id: sync
        continue-on-error: true
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          # The per-run GITHUB_TOKEN gives 1000 req/h — plenty for a personal
          # portfolio. Override via repo secret PORTFOLIO_TOKEN if you need
          # cross-org access.
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_TOKEN || secrets.GITHUB_TOKEN }}
        run: pnpm sync

      # Keepalive: committing here resets GitHub's 60-day inactivity timer,
      # which otherwise auto-disables the scheduled cron.
      - name: Commit refreshed data.json
        if: steps.sync.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.json
          if git diff --cached --quiet; then echo 'data.json unchanged'; exit 0; fi
          git commit -m 'chore(data): daily sync [skip ci]'
          git push

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
