<script>
  // Minimal DOM-rendered demo-video document for scripts/make-card-clip.test.ts: a 6 s
  // window.smDemo that draws the current time with HTML + SVG on a letterboxed 16:9 stage.
  const bg = document.getElementById('bg');
  const dot = document.getElementById('dot');
  const label = document.getElementById('label');
  function draw(t) {
    bg.setAttribute('fill', 'hsl(' + Math.round((t / 6) * 360) + ', 60%, 30%)');
    dot.setAttribute('cx', String(80 + (t / 6) * 1120));
    label.textContent = 't = ' + t.toFixed(1) + ' s';
  }
  window.smDemo = {
    duration: 6,
    scenes: [{ id: 'a', start: 0, end: 6, title: 'A' }],
    seek: draw,
    play() {},
    pause() {},
  };
  draw(0);
</script>
</body>
